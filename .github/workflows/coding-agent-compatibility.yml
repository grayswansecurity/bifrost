name: Coding Agent Compatibility

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      cli:
        description: "Coding-agent lane to run"
        required: true
        default: both
        type: choice
        options:
          - both
          - claude
          - codex
      scenario:
        description: "Existing CLI harness scenario"
        required: true
        default: simple-chat
        type: choice
        options:
          - simple-chat
          - tool-call
          - file-read
          - conversation-memory
      claude_code_version:
        description: "Exact @anthropic-ai/claude-code version"
        required: true
        default: "2.1.220"
        type: string
      codex_version:
        description: "Exact @openai/codex version"
        required: true
        default: "0.145.0"
        type: string

concurrency:
  group: coding-agent-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  binary-smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Claude Code / Anthropic
            cli: claude
            package: "@anthropic-ai/claude-code"
            provider: anthropic
            model: claude-sonnet-4-6
          - name: Codex / OpenAI
            cli: codex
            package: "@openai/codex"
            provider: openai
            model: gpt-5.2
    env:
      RUN_LANE: ${{ (github.event_name == 'workflow_dispatch' || vars.BIFROST_CODING_AGENT_CANARY_ENABLED == 'true') && (github.event_name == 'schedule' || inputs.cli == 'both' || inputs.cli == matrix.cli) }}
      BIFROST_BASE_URL: ${{ vars.BIFROST_CODING_AGENT_BASE_URL }}
      BIFROST_CANARY_API_KEY: ${{ secrets.BIFROST_CODING_AGENT_API_KEY }}
      CANARY_SCENARIO: ${{ inputs.scenario || 'simple-chat' }}
      CLI_PACKAGE: ${{ matrix.package }}
      CLI_PACKAGE_VERSION: ${{ matrix.cli == 'claude' && (inputs.claude_code_version || '2.1.220') || (inputs.codex_version || '0.145.0') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: env.RUN_LANE == 'true'
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout repository
        if: env.RUN_LANE == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        if: env.RUN_LANE == 'true'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Set up Node.js
        if: env.RUN_LANE == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"

      - name: Validate canary configuration
        if: env.RUN_LANE == 'true'
        env:
          CLI_ID: ${{ matrix.cli }}
          PROVIDER_ID: ${{ matrix.provider }}
          MODEL_ID: ${{ matrix.model }}
        run: |
          if [[ -z "$BIFROST_BASE_URL" ]]; then
            echo "Repository variable BIFROST_CODING_AGENT_BASE_URL is required" >&2
            exit 1
          fi
          if [[ -z "$BIFROST_CANARY_API_KEY" ]]; then
            echo "Repository secret BIFROST_CODING_AGENT_API_KEY is required" >&2
            exit 1
          fi
          mkdir -p tests/e2e/clis/reports
          jq -n \
            --arg cli "$CLI_ID" \
            --arg package "$CLI_PACKAGE" \
            --arg requestedVersion "$CLI_PACKAGE_VERSION" \
            --arg provider "$PROVIDER_ID" \
            --arg model "$MODEL_ID" \
            --arg scenario "$CANARY_SCENARIO" \
            --arg bifrostCommit "$GITHUB_SHA" \
            --arg runURL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{cli: $cli, package: $package, requestedVersion: $requestedVersion, provider: $provider, model: $model, scenario: $scenario, bifrostCommit: $bifrostCommit, runURL: $runURL}' \
            > tests/e2e/clis/reports/canary-environment.json

      - name: Install pinned coding-agent binary
        if: env.RUN_LANE == 'true'
        run: npm install --global "$CLI_PACKAGE@$CLI_PACKAGE_VERSION"

      - name: Record installed binary version
        if: env.RUN_LANE == 'true'
        env:
          CLI_ID: ${{ matrix.cli }}
        run: |
          INSTALLED_VERSION=$("$CLI_ID" --version | tr '\n' ' ')
          jq --arg installedVersion "$INSTALLED_VERSION" \
            '. + {installedVersion: $installedVersion}' \
            tests/e2e/clis/reports/canary-environment.json \
            > tests/e2e/clis/reports/canary-environment.tmp
          mv tests/e2e/clis/reports/canary-environment.tmp tests/e2e/clis/reports/canary-environment.json

      - name: Run coding-agent smoke scenario
        if: env.RUN_LANE == 'true'
        env:
          CLI_ID: ${{ matrix.cli }}
          PROVIDER_ID: ${{ matrix.provider }}
          MODEL_ID: ${{ matrix.model }}
          API_KEY: ${{ secrets.BIFROST_CODING_AGENT_API_KEY }}
        run: |
          make run-cli-harness-test \
            CLI="$CLI_ID" \
            PROVIDER="$PROVIDER_ID" \
            MODEL="$MODEL_ID" \
            SCENARIO="$CANARY_SCENARIO" \
            PARALLEL=1 \
            BASE_URL="$BIFROST_BASE_URL" \
            TIMEOUT=15m \
            QUIET=1

      - name: Upload coding-agent diagnostics
        if: always() && env.RUN_LANE == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coding-agent-${{ matrix.cli }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/e2e/clis/reports/
          if-no-files-found: warn
          retention-days: 14
